<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#141819" />
    <title>Remote Cursor</title>
    <link rel="stylesheet" href="/styles.css?v=20260813-25" />
    <script src="/app.js?v=20260813-25" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#conversation">대화로 바로가기</a>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="에이전트 세션">
        <div class="sidebar-windowbar">
          <button class="icon-button sidebar-collapse-button" id="close-sidebar" type="button" aria-label="사이드바 접기" aria-controls="sidebar" aria-expanded="true">
            <svg class="codicon" aria-hidden="true"><use href="/vendor/codicons.svg#layout-sidebar-left"></use></svg>
          </button>
        </div>

        <nav class="primary-nav" aria-label="세션 도구">
          <button class="primary-nav-button" id="search-toggle" type="button" aria-expanded="false" aria-controls="search-panel">
            <svg class="codicon" aria-hidden="true"><use href="/vendor/codicons.svg#search"></use></svg>
            <span>Search</span><kbd>⌘K</kbd>
          </button>
        </nav>

        <div class="search-panel" id="search-panel" hidden>
          <label class="search-field" for="search-input">
            <svg class="codicon" aria-hidden="true"><use href="/vendor/codicons.svg#search"></use></svg>
            <span class="visually-hidden">세션 검색</span>
            <input id="search-input" type="search" placeholder="Search sessions" autocomplete="off" />
            <span class="search-count" id="session-count" aria-live="polite"></span>
          </label>
        </div>

        <div class="sidebar-scroll">
          <section class="sidebar-section repository-section" aria-labelledby="repositories-heading">
            <div class="section-heading-row">
              <h2 class="section-label" id="repositories-heading">
                <button class="repositories-toggle" id="repositories-toggle" type="button" aria-expanded="true" aria-controls="session-list">
                  <span>Repositories</span>
                  <svg class="codicon disclosure-chevron" aria-hidden="true"><use href="/vendor/codicons.svg#chevron-down"></use></svg>
                </button>
              </h2>
              <div class="section-actions">
                <button class="micro-button" id="archive-toggle" type="button" aria-pressed="false" aria-label="보관된 세션 보기" title="보관된 세션 보기">
                  <svg class="codicon" aria-hidden="true"><use href="/vendor/codicons.svg#filter"></use></svg>
                </button>
              </div>
            </div>
            <nav class="session-list" id="session-list" aria-label="저장소별 세션 목록"></nav>
          </section>
        </div>

        <footer class="account-footer">
          <span class="account-avatar-shell">
            <img class="account-avatar-image" id="profile-avatar" alt="" hidden />
            <span class="account-avatar" id="profile-fallback" aria-hidden="true">RC</span>
          </span>
          <span class="account-copy">
            <strong id="profile-email">Remote Cursor</strong>
            <span id="profile-plan">Read-only mirror</span>
          </span>
          <span class="connection-dot" id="connection-dot" role="status">
            <span class="visually-hidden" id="connection-label">로컬 데이터 연결 중…</span>
          </span>
        </footer>
      </aside>

      <button class="sidebar-scrim" id="sidebar-scrim" type="button" aria-label="세션 목록 닫기"></button>

      <main class="main-pane" id="conversation" tabindex="-1">
        <header class="conversation-header">
          <div class="collapsed-sidebar-tools">
            <button class="icon-button sidebar-expand-button" id="open-sidebar" type="button" aria-label="사이드바 펼치기" aria-controls="sidebar" aria-expanded="false">
              <svg class="codicon" aria-hidden="true"><use href="/vendor/codicons.svg#layout-sidebar-left"></use></svg>
            </button>
            <button class="icon-button collapsed-search-button" id="collapsed-search" type="button" aria-label="세션 검색">
              <svg class="codicon" aria-hidden="true"><use href="/vendor/codicons.svg#search"></use></svg>
            </button>
          </div>
          <div class="conversation-heading">
            <h1 id="conversation-title">세션을 선택하세요</h1>
            <span id="conversation-meta"></span>
          </div>
        </header>

        <section class="conversation-content" id="conversation-content" aria-live="polite">
          <div class="empty-state">
            <h2>로컬 에이전트 대화</h2>
            <p>사이드바에서 세션을 선택하면 Cursor Agent Window의 대화가 여기에 나타납니다.</p>
          </div>
        </section>

        <footer class="composer-shell" aria-label="메시지 작성 기능 상태">
          <div class="composer-inner">
            <div class="session-chip-row">
              <div class="session-chip-strip" aria-label="관련 pull request">
                <span class="pr-chip-list" id="pr-chip-list" hidden></span>
              </div>
              <button class="go-bottom-button" id="go-bottom" type="button" aria-label="대화 하단으로 이동" title="Go to bottom" hidden>
                <svg class="codicon" aria-hidden="true"><use href="/vendor/codicons.svg#arrow-down"></use></svg>
              </button>
            </div>
            <div class="composer-disabled" aria-disabled="true" title="메시지 전송은 Phase 2에서 제공됩니다">
              <span class="composer-plus" aria-hidden="true"><svg class="codicon"><use href="/vendor/codicons.svg#add"></use></svg></span>
              <span class="composer-placeholder">Send follow-up</span>
              <span class="composer-mode">Phase 2 <svg class="codicon" aria-hidden="true"><use href="/vendor/codicons.svg#chevron-down"></use></svg></span>
              <span class="composer-mic" aria-hidden="true"><svg class="codicon"><use href="/vendor/codicons.svg#mic"></use></svg></span>
            </div>
            <div class="context-bar">
              <span class="context-item branch-context" id="branch-context" hidden>
                <svg class="codicon" aria-hidden="true"><use href="/vendor/codicons.svg#git-branch"></use></svg>
                <span id="branch-name"></span>
              </span>
            </div>
          </div>
        </footer>
      </main>
    </div>
    <div class="visually-hidden" id="status-announcer" role="status" aria-live="polite"></div>
  </body>
</html>
